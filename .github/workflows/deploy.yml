# Static website deploy.
# Pull request -> build only (check).  Merge/push to main -> build + upload to the server over SFTP.

name: Deploy static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REMOTE_DIR: public_html

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Check output
        run: |
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          test -f out/sitemap.xml || { echo "out/sitemap.xml missing"; exit 1; }
          du -sh out

      - name: Install lftp
        if: github.event_name != 'pull_request'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to server via SFTP
        if: github.event_name != 'pull_request'
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        run: |
          lftp --env-password -u "$SFTP_USERNAME" -p "${SFTP_PORT:-22}" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob .htaccess \
              --exclude ^\.well-known/ \
              --exclude ^cgi-bin/ \
              out/ $REMOTE_DIR/;
            bye
          "
