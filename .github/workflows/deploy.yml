name: CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Placeholder for the Prisma CLI only; the app reads Turso vars at runtime.
          DATABASE_URL: file:./build.db
          # Pages that prerender at build time read from Turso.
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Assemble deploy bundle
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          mkdir -p deploy/tmp && touch deploy/tmp/restart.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: deploy-bundle
          path: deploy
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: deploy

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload over SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          for v in SFTP_HOST SFTP_PORT SFTP_USERNAME LFTP_PASSWORD SFTP_REMOTE_DIR; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret for $v"; exit 1; }
          done
          # Never deletes outside .next, so server-side files like .env survive.
          lftp -p "$SFTP_PORT" -u "$SFTP_USERNAME" --env-password "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          mkdir -p -f $SFTP_REMOTE_DIR
          cd $SFTP_REMOTE_DIR
          mirror -R --delete --parallel=4 deploy/.next .next
          mirror -R --parallel=4 --exclude-glob .next/ --exclude-glob tmp/ deploy .
          mkdir -p -f tmp
          put deploy/tmp/restart.txt -o tmp/restart.txt
          bye
          EOF
