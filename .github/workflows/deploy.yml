# Builds the public (site) pages as a static export and uploads them over SFTP.
# Runs on every push to main, or manually from the Actions tab.
# Admin, login, API routes and proxy.ts are NOT deployed (frontend only).

name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  # Folder on the server where the site lives. Change if yours differs.
  REMOTE_DIR: public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare frontend-only build
        run: |
          rm -rf app/admin app/api app/login proxy.ts
          cp ci/referral-tracker.static.tsx components/site/referral-tracker.tsx

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DATABASE_URL: file:./build.db
          AUTH_SECRET: build-only-placeholder
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Check export output
        run: |
          test -f out/index.html || { echo "out/index.html missing - static export failed"; exit 1; }
          du -sh out

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to server via SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        run: |
          lftp --env-password -u "$SFTP_USERNAME" -p "${SFTP_PORT:-22}" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob .htaccess \
              --exclude ^\.well-known/ \
              --exclude ^cgi-bin/ \
              out/ $REMOTE_DIR/;
            bye
          "
